/* Speed run */
.challenge-ready,.challenge-result{text-align:center;padding:24px 10px;max-width:680px;margin:auto}.challenge-ready h2,.challenge-result h2{font-size:38px;letter-spacing:-1px}.challenge-ready .run-table{font-size:92px;font-weight:900;color:var(--lime);margin:14px 0 2px}.run-details{display:flex;gap:13px;justify-content:center;flex-wrap:wrap;margin:14px 0 22px;font-size:14px;color:#bac6e0}.run-details>span{border:1px solid var(--line);padding:8px 12px;border-radius:9px;background:#a8b8e708}.coin-preview{color:var(--gold);font-size:19px;font-weight:800}.challenge-ready .muted{font-size:14px;line-height:1.6;margin:12px 0}.challenge-live{max-width:670px;margin:auto;padding:10px 8px 20px}.run-topline{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}.run-topline h2{font-size:23px}.run-topline p{font-size:14px;color:var(--muted);margin-top:6px}.stopwatch{font-size:40px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:-1px}.run-track{height:8px;border-radius:10px;background:#0c1428;overflow:hidden}.run-track>span{display:block;height:100%;background:var(--lime);transition:width .13s}.equation{text-align:center;font-size:82px;font-weight:900;letter-spacing:-3px;margin:28px 0 20px;white-space:nowrap}.equation .eq-symbol{font-weight:500;color:#7e8fac;margin:0 10px}.answer-form{display:flex;gap:12px;justify-content:center;align-items:center}.answer-form label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.answer-form input{width:190px;background:#101b30;border:2px solid #93b77a;border-radius:12px;color:white;font-size:43px;text-align:center;padding:9px 12px;letter-spacing:2px;font-weight:800;outline-offset:3px}.answer-form button{font-size:17px;min-height:71px;padding:15px 24px}.answer-feedback{text-align:center;min-height:28px;margin-top:16px;color:#ffbd88;font-size:15px;font-weight:700}.run-bottom{text-align:center;font-size:13px;color:#8e9fbc;margin-top:8px}.challenge .pack-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.pack-offer{background:#c5d2f209;border:1px solid var(--line);border-radius:15px;padding:19px;display:flex;flex-direction:column;align-items:center;text-align:center}.pack-offer h3{font-size:23px;margin-bottom:8px}.pack-offer .pack-note{font-size:14px;line-height:1.55;color:#b4c0da;min-height:45px}.pack-picture{position:relative;width:132px;height:173px;margin:22px 0 17px;border:2px solid var(--pack-accent,#9caff0);border-radius:8px;background:linear-gradient(135deg,#ffffff22,transparent 35%),linear-gradient(145deg,var(--pack-a,#5669b7),var(--pack-b,#262a5a));box-shadow:8px 9px 0 #080d2444,0 12px 25px #050d2e40;transform:rotate(-5deg);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px;isolation:isolate}.pack-picture::before,.pack-picture::after{content:'';position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,#d9e0ff44 0 2px,transparent 2px 5px)}.pack-picture::before{top:3px}.pack-picture::after{bottom:3px}.pack-picture .pack-mark{font-size:43px;color:var(--pack-accent,#d4dbff);filter:drop-shadow(0 3px 0 #0004)}.pack-picture b{font-size:11px;letter-spacing:1px}.pack-picture small{font-size:10px;color:#ffffffaa;letter-spacing:2px}.pack-picture.lucky{--pack-a:#207b70;--pack-b:#154240;--pack-accent:#b5f5a9;transform:rotate(3deg)}.pack-picture.shiny{--pack-a:#815b96;--pack-b:#3e3e78;--pack-accent:#ffe5a2;background:linear-gradient(120deg,#ffcc8a55,#b3c4f733 45%,#f4aada44),linear-gradient(145deg,var(--pack-a),var(--pack-b))}.pack-offer .pack-price{display:flex;gap:7px;align-items:center;font-size:27px;color:var(--gold);font-weight:900;margin:2px 0 14px}.pack-offer .primary-button{width:100%;margin-top:auto}.pack-offer .odds-button{background:transparent;color:#bdcbe4;font-size:13px;padding:13px 6px 0;text-decoration:underline;text-underline-offset:3px}.pack-bottom{display:flex;justify-content:space-between;align-items:center;gap
